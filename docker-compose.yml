services:

  frontend:
    build:
      context: ./frontend
    container_name: yewfence-frontend
    image: yewfence-frontend:latest
    # 端口映射到8080，使用nginx反代
    ports:
      - "8080:80"
    volumes:
      # 挂载nginx日志目录
      - ./yewfence_site_data/logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - backend
    # healthcheck 由 Dockerfile 定义

  backend:
    build: ./backend
    container_name: yewfence-backend
    image: yewfence-backend:latest
    ports:
      - "5000:5000"
    volumes:
      # 挂载数据库目录（持久化数据）
      - ${DATA_MOUNT_DIR}/instance:/app/instance
      # 挂载日志目录
      - ./yewfence_site_data/logs/gunicorn:/var/log/gunicorn
    environment:
      # 使用docker时默认为生产环境
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key-in-production}
      # 管理员账户配置（用于自动初始化）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
      - VITE_BLOG_REDIRECT_URL=${VITE_BLOG_REDIRECT_URL:-http://localhost:8080/blog}
    restart: unless-stopped
    # healthcheck 由 Dockerfile 定义