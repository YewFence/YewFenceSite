services:

  frontend:
    build:
      context: ./frontend
    container_name: yewfence-frontend
    image: yewfence-frontend:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: .
    container_name: yewfence-backend
    image: yewfence-backend:latest
    ports:
      - "5000:5000"
    volumes:
      # 挂载数据库目录（持久化数据）
      - ./yewfence_site_data/instance:/app/instance
      # 挂载文章目录（可选，方便编辑）
      # - ./yewfence_site_data/posts:/app/posts
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key-in-production}
      - DATABASE_URI=sqlite:////app/instance/data.db
      # 管理员账户配置（用于自动初始化）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    restart: unless-stopped
    networks:
      - app-network
    # healthcheck 由 Dockerfile 定义

# 定义网络
networks:
  app-network:
    driver: bridge
