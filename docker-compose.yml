services:

  # 前端构建服务 (build-only)
  frontend:
    build:
      context: ./frontend
    container_name: yewfence-frontend
    image: yewfence-frontend:latest
    volumes:
      # 挂载输出目录到共享 bind mount
      - frontend-dist-data:/output
    # 构建完成后退出，不需要持续运行
    restart: "no"
    command: sh -c "cp -r /app/dist/* /output/ && echo 'Frontend build completed and files copied to volume.'"

  backend:
    build: .
    container_name: yewfence-backend
    image: yewfence-backend:latest
    ports:
      - "5000:5000"
    volumes:
      # 挂载数据库目录（持久化数据）
      - ./yewfence_site_data/instance:/app/instance
      # 挂载文章目录（可选，方便编辑）
      # - ./yewfence_site_data/posts:/app/posts
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key-in-production}
      - DATABASE_URI=sqlite:////app/instance/data.db
      # 管理员账户配置（用于自动初始化）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    restart: unless-stopped
    # healthcheck 由 Dockerfile 定义

# 定义共享 bind mount 卷
volumes:
  frontend-dist-data:
    name: frontend-dist-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./yewfence_site_data/frontend_dist

