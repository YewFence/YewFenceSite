services:
  web:
    build: .
    container_name: yewfence-blog
    image: yewfence-site:latest
    ports:
      - "5000:5000"
    volumes:
      # 挂载数据库目录（持久化数据）
      - ./yewfence_site_data/instance:/app/instance
      # 挂载文章目录（可选，方便编辑）
      # - ./yewfence_site_data/posts:/app/posts
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key-in-production}
      - DATABASE_URI=sqlite:////app/instance/data.db
      # 管理员账户配置（用于自动初始化）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    restart: unless-stopped
    # healthcheck 由 Dockerfile 定义

# 如果需要使用 Nginx Docker 的网络进行反向代理，可以取消下面的注释
#   networks:
#     - nginx-proxy-network
# networks:
#   nginx-proxy-network:
#     external: true